[package]
name = "qr-reader"
version = "0.1.0"
edition = "2021"

[lib]
name = "qr_reader"
path = "src/lib.rs"

[[bin]]
name = "qr-reader"
path = "src/main.rs"

[dependencies]
pdfium-render = {
    version = "0.9.4",
    features = [
        "image_025"
    ]
}

image = "0.25"
rqrr = "0.11.0"
anyhow = "1"
clap = {
    version = "4",
    features = [
        "derive"
    ]
}

serde = {
    version = "1",
    features = [
        "derive"
    ]
}

serde_json = "1"
