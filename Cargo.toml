[package]
name = "qr-reader"
version = "0.1.0"
edition = "2024"

[lib]
name = "qr_reader"
path = "src/lib.rs"

[[bin]]
name = "qr-reader"
path = "src/main.rs"

[dependencies]
pdfium-render = { version = "0.8", features = ["image"] }
image = "0.25"
rqrr = "0.11.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
